# 적용 규칙: phase5 integrator는 아래 overlay를 acceptance_criteria·constraints·
# ontology에 머지하여 plans/handoff에 반영. overlay와 자동 시드가 충돌하면
# overlay 우선 (사용자 최종 답변 라운드가 더 최근 결정).

supplemental_overlay:
  source:
    type: user_final_round + new_branches
    rounds:
    - U1 (art pipeline + breeding pivot)
    - U2 (Korean UI)
    - U3 (codename-only branding)
    - N5 (breeding chain boundary)
    - N6 (breeding cooldown/limit)
    - N7 (hybrid discovery reward)
    timestamp: 2026-04-13

  overrides:
    rarity_tiers_revised:
      original: 3 tiers (common/rare/epic)
      revised: 2 base tiers (common/rare). Epic·legendary는 교배(breeding) emergent
        결과로만 등장. base catalog에 epic 슬롯 미존재.
      rationale: U1 — solo dev art workload 절감 + emergent rarity가 hybrid discovery
        루프와 정합.
    contract_count_revised:
      original: 5 contracts (Marketplace via Reservoir delegation)
      revised: 6 contracts. Marketplace를 자체 deploy (EIP-712 오더북 + Seaport 결제 위임형,
        royalty enforce 자체 보장).
      rationale: D4 phase3 — Reservoir 위임 시 royalty enforce·2차 수수료 수금이 제3자 인프라
        의존 → 1인 운영 risk. Spearbit·Code4rena 경량 감사 $40K 예산 내 6개 OpenZeppelin
        베이스 컨트랙트 가능.
    audit_budget:
      value: 40000
      currency: USD
      breakdown: 30K base audit + 10K re-audit reserve
    primary_sale_revenue_breakdown:
      team_472K: audit 40K + art_outsource 0 (solo Blender) + initial_ops_6_9mo 130K
        + sustained_ops_2yr 192K + reserve 50K + breeding_dev_marginal 60K
      treasury_202K: community events + season airdrops + bug bounty + DEX liquidity
        seed at $RANCH TGE
      note: 아트 외주 $60K 절감 → 교배 시스템 개발·예비비로 재배치 (U1)
    tge_trigger_full:
      condition: DAU 50K + 2차 마켓 월 거래량 $200K 2개월 연속 충족 → Season 2 시작점에 $RANCH
        TGE
      original_seed_partial: DAU 50K only
      rationale: phase3 D2 — volume 트리거 누락. 활동 기반 airdrop weighting (플레이 시간·길드
        기여·NFT 홀딩) 포함.

  added_features:
    breeding_system:
      status: MVP_REQUIRED
      summary: 두 부모 동물 교배 → 자손 동물. trait DNA 절차적 합성 + Blender shader 파라미터
        매핑으로 런타임 외형 생성 (별도 모델링 불필요).
      mechanics:
        parent_count: 2
        trait_inheritance: weighted average + random mutation + sometimes_rare_emergence
        appearance: parent color/pattern/body weighted average + random mutation
        stats: parent stat weighted average + variance
        rarity_emergence: 사전 정의 hybrid pattern과 trait 조합 매치 시 새 hybrid breed 발견
          (collection 보상)
      onchain_offchain_boundary:
        decision: Option B (Axie-style)
        trait_dna_storage: off-chain (server)
        result_nft_storage: on-chain (NFT mint with metadata hash)
        rationale: N5 — Sunflower 오프체인 우선 원칙 정합, 가스비 ↓
      cooldown_and_limits:
        cooldown_initial_hours: 72
        cooldown_increment_per_breed_hours: 24
        lifetime_max_breeds_per_animal: 7
        feed_cost_base: 100
        feed_cost_modifier: 부모 희귀도 합산 가중
        rationale: N6 — CryptoKitties siring cap 패턴, Axie 무한 교배 인플레 반면교사
      hybrid_discovery_rewards:
        predefined_hybrid_pattern_count_range: [30, 50]
        first_discoverer_reward:
        - NFT trophy (commemorative, non-tradeable initially)
        - $FEED bonus
        scope_for_content: Season 1·2 컨텐츠 (커뮤니티 6~12개월 발견 소요 추정)
        rationale: N7 — discovery board 게이미피케이션 + 2차 마켓 깊이 ↑
      tokenomics_impact:
      - $FEED sink 추가 (인플레 완화)
      - hybrid 발견 NFT 민팅 가능 (2차 마켓 추가 공급)
      - cooldown·breeding limit으로 봇 매크로 방지

    art_pipeline:
      tool_chain:
        client: Godot
        modeling: Blender
        outsourcing: false
        artist: solo_developer (self)
      modeling_workload:
        base_animals: 5 species × 1 base mesh
        accessories: 5-10 (cosmetic items)
        estimated_weeks: 4-6
      shader_strategy: Blender shader 파라미터 조합으로 런타임 외형 생성 (교배 자손 별도 모델링 불필요)

    localization:
      decision: option_A (Korean NOT provided)
      languages_at_launch:
      - English
      - Japanese
      - Vietnamese (SE Asia Web3)
      - Thai (SE Asia Web3)
      korean_excluded: true
      rationale: U2 — 위메이드 이미르 전례, 한국 서비스 의도 부재를 언어 선택으로 증명. Pixels·Sunflower
        SE Asia Web3 유저 비중 높음.

    branding:
      codename: mallang-ranch-p2e
      external_brand_name: '{TBD_BRAND_NAME}'
      art_style_placeholder: TBD (사용자 추후 결정)
      usage_rule: phase4~7 모든 산출물에서 codename 사용. 마케팅 브랜드는 사용자가 직접 결정.
      rationale: U3 — 사용자 직접 결정 영역, 에이전트 기본 추천 보류.

  added_constraints:
  - 'Breeding system: trait DNA 오프체인 / 결과 NFT 온체인 (Option B)'
  - 'Breeding cooldown 72h base + 24h increment per breed, lifetime 7 breeds per animal'
  - 'Breeding cost 100 $FEED base + parent rarity weighted modifier'
  - 'Korean UI NOT provided. EN/JA/VI/TH only at launch'
  - 'Brand name remains TBD ({TBD_BRAND_NAME}); codename mallang-ranch-p2e for all
    artifacts'
  - 'Art pipeline: Godot client + Blender modeling, solo developer no outsourcing'
  - 'Audit budget cap $40K (30K base + 10K re-audit reserve)'
  - 'TGE trigger: DAU 50K + monthly secondary volume $200K, both sustained 2 consecutive
    months'

  added_acceptance_criteria:
  - 'Breeding MVP shipped: 2-parent breeding produces offspring with weighted-average
    + mutation traits, off-chain DNA + on-chain NFT result'
  - 'Hybrid discovery board live: 30-50 predefined hybrid patterns, first-discoverer
    NFT trophy + $FEED bonus'
  - 'Animal rarity revised: 2 base tiers (common/rare) at launch; epic+ emerges from
    breeding only'
  - 'Smart contracts revised to 6: AnimalNFT / LandNFT / ItemNFT / RanchToken / FeedClaim
    / Marketplace (self-deployed, EIP-712 + Seaport delegation, royalty enforce)'
  - 'Localization at launch: English, Japanese, Vietnamese, Thai. Korean NOT provided'
  - 'Codename mallang-ranch-p2e used in all artifacts; external brand placeholder
    {TBD_BRAND_NAME}'
  - '$RANCH TGE trigger requires both DAU≥50K AND monthly secondary volume ≥$200K
    sustained 2 consecutive months'
  - 'Cayman Foundation 설립은 TGE 6개월 전 완료 (Season 0는 개인사업자/싱가포르 BVI Ltd로 시작 가능)'
  - 'Breeding economics: 100 $FEED base cost, lifetime 7 breeds/animal cap, 72h cooldown
    +24h increment'

  added_ontology_fields:
  - name: breeding_event
    type: object
    description: 두 부모 동물 교배 트랜잭션. parent_a_id, parent_b_id, child_id, trait_dna_hash
      (on-chain), full_dna (off-chain), feed_cost, cooldown_until, breed_count_consumed
      필드 포함
    required: true
  - name: hybrid_pattern
    type: object
    description: 사전 정의 hybrid breed 카탈로그 (30-50종). pattern_id, trait_signature,
      first_discoverer_address, discovery_timestamp, trophy_nft_id 필드 포함
    required: true
  - name: trait_dna
    type: object
    description: 동물의 절차적 외형/스탯 DNA. off-chain 저장, on-chain은 hash만. parent_lineage,
      color_genes, pattern_genes, stat_genes, mutation_seed 필드
    required: true

  open_branches_parked:
  - id: N1
    title: Cayman Foundation 설립 시점
    decision: TGE 6개월 전 설립. Season 0는 개인사업자 or 싱가포르 BVI Ltd로 시작.
    park_to: ideas-parking-lot.md
  - id: N2
    title: Apple iOS F2P 네이티브 빌드
    decision: v2 파킹 (1인 9개월 타겟엔 2-3개월 추가 공수 과도)
    park_to: ideas-parking-lot.md
  - id: N3
    title: Immutable zkEVM Passport 크로스체인 활용
    decision: 기본 Base + Coinbase Smart Wallet, Immutable Passport는 심사 통과 시 2순위 조건부
    park_to: research-vault (followup investigation)
  - id: N4
    title: Proof of Humanity 선택
    decision: Gitcoin Passport (Web3 네이티브·무료·Base 연동). World ID는 iris scan 진입장벽으로
      후순위
    park_to: ideas-parking-lot.md

  validation_checklist_status:
