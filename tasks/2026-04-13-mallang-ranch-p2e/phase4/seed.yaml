# NOTE: 본 YAML은 두 부분으로 구성됨.
#   (1) MCP 자동 생성 시드 (인터뷰 세션 캡처분)
#   (2) supplemental_overlay — 사용자 최종 답변 라운드 (U1·U2·U3) 및 파생 분기
#       (N5·N6·N7) 반영. MCP 세션은 사용자 라운드 종결 전 ambiguity 조기 종료한
#       탓에 자동 시드에 미반영. phase5 integrator가 두 섹션을 병합하여 살아있는
#       문서·핸드오프 request.json에 모두 적용해야 함.

goal: Build a cozy P2E ranch mobile game (original brand inspired by 말랑말랑목장 aesthetics)
  on Base L2 with NFT-primary revenue model, targeting global 170-country launch in
  9 months with a solo developer
task_type: code
brownfield_context:
  project_type: greenfield
  context_references: []
  existing_patterns: []
  existing_dependencies: []
constraints:
- Solo developer (1-person team)
- 9-month Season 0 MVP deadline
- Base L2 only (no custom L2)
- No direct IP usage from 말랑말랑목장 (aesthetics reference only, original brand required)
- Korea IP/KYC blocked (170 countries, Korea excluded)
- No $RANCH token at Season 0 launch (token-free until DAU 50K+)
- No team reserve tokens (Sunflower Land philosophy)
- Contracts deployed on Base + off-chain server only
- Maximum 5-6 smart contracts
- Gas-free gameplay
- Open-source codebase
acceptance_criteria:
- Season 0 launches with 5 animal species, 3 rarity tiers (common/rare/epic), 3 ranch
  sizes (trial/small/large)
- 'Land NFT primary sale completes: 5,000 total supply (4,000 Small + 1,000 Large)
  with WL 48h priority → public fixed-price 2-stage structure'
- Small Land priced at 0.03 ETH public / 0.02 ETH WL; Large Land at 0.15 ETH public
  / 0.10 ETH WL
- Primary sale revenue split 70% team / 30% community treasury
- Secondary royalty 5% split 50% team / 50% treasury
- Treasury governed by Gnosis Safe 2-of-3 multisig at Season 0; upgrades to on-chain
  Snapshot vote post-$RANCH TGE
- $RANCH TGE triggered only after DAU reaches 50,000
- Expected primary sale ceiling $675K covering $280K costs + $400K treasury seed
- 'Smart contracts: AnimalNFT / LandNFT / ItemNFT / RanchToken / FeedClaim (Marketplace
  via Reservoir delegation, 5-contract architecture)'
- 'Triple token structure implemented: Animal/Land/Rare Item NFT + $RANCH ERC-20 +
  $FEED spend-only'
- 10 domain entities modeled
- 'Development phases: 3mo contracts+audit → 3mo game loop+art integration → 3mo closed
  alpha+bugfix+sale prep'
ontology_schema:
  name: MallangRanchP2EDomain
  description: Core domain model for a cozy P2E ranch game on Base L2, covering NFT
    assets, tokenomics, land ownership, animal breeding, revenue distribution, and
    governance lifecycle
  fields:
  - name: animal
    type: object
    description: ERC-721 NFT with species (5 types), rarity (common/rare/epic), and
      on-chain attributes
    required: true
  - name: land
    type: object
    description: ERC-721 NFT with size tier (trial/small/large), ownership, and capacity
      metadata
    required: true
  - name: rare_item
    type: object
    description: ERC-721 NFT for special in-game items with rarity attributes
    required: true
  - name: ranch_token
    type: object
    description: $RANCH ERC-20 governance and utility token; not issued until DAU
      50K+ TGE trigger
    required: true
  - name: feed_token
    type: object
    description: $FEED spend-only in-game currency; non-transferable, used for gameplay
      actions
    required: true
  - name: primary_sale
    type: object
    description: Land NFT initial sale event with WL/public stages, pricing, and revenue
      allocation
    required: true
  - name: revenue_split
    type: object
    description: Distribution record for primary (70/30 team/treasury) and secondary
      (50/50) royalty flows
    required: true
  - name: treasury
    type: object
    description: Community treasury governed by Gnosis Safe multisig, seeded from
      primary sale 30%
    required: true
  - name: season
    type: object
    description: Game season lifecycle (Season 0 = no token; Season 1+ = $RANCH active)
      with DAU thresholds and TGE conditions
    required: true
  - name: governance
    type: object
    description: On-chain voting structure via Snapshot post-TGE; Season 0 uses team
      committee + community advisory
    required: true
evaluation_principles:
- name: solo_feasibility
  description: All decisions must be executable by a single developer within 9-month
    timeline without burnout
  weight: 0.3
- name: revenue_sustainability
  description: Primary NFT sale must fully cover $280K launch costs and seed $400K+
    treasury
  weight: 0.25
- name: community_trust
  description: Revenue splits and governance structures must signal credible decentralization
    (Sunflower philosophy alignment)
  weight: 0.2
- name: tokenomics_safety
  description: $RANCH TGE only after proven DAU 50K+; $FEED must remain spend-only
    with no speculative value
  weight: 0.15
- name: scope_minimalism
  description: MVP scope frozen at confirmed minimums; no feature creep beyond 5 animals
    / 3 rarities / 3 ranch sizes
  weight: 0.1
exit_conditions:
- name: season0_launched
  description: Season 0 is live on Base mainnet with NFT sale completed and game loop
    functional
  criteria: Primary sale closes with ≥80% of 5,000 Land NFTs sold and DAU growth trending
    toward 50K
- name: tge_triggered
  description: $RANCH TGE conditions met
  criteria: DAU sustained above 50,000 for 30 consecutive days
- name: dev_failure
  description: Solo developer cannot continue within 9-month window
  criteria: Budget exhausted below $50K reserve or developer incapacitation — pause
    and reassess team structure
- name: scope_breach
  description: MVP scope expands beyond confirmed limits
  criteria: Any addition of animal species >5, rarity tiers >3, or ranch sizes >3
    triggers scope review gate
- name: treasury_governance_upgrade
  description: Season 0 committee governance replaced by on-chain voting
  criteria: $RANCH TGE completed and Snapshot contract deployed on Base
